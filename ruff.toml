target-version = "py311"
unsafe-fixes = true

[lint]
select = [
    "F",      # Pyflakes
    "E",      # pycodestyle
    "W",      # pycodestyle
    "E",      # Error
    "W",      # Warning
    "C90",      # mccabe
    "I",      # isort
    "N",      # pep8-naming
    # "D",      # pydocstyle
    "UP",      # pyupgrade
    "YTT",      # flake8-2020
    # "ANN",      # flake8-annotations
    "ASYNC",      # flake8-async
    "TRIO",      # flake8-trio
    # "S",      # flake8-bandit
    # "BLE",      # flake8-blind-except
    # "FBT",      # flake8-boolean-trap
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    # "COM",      # flake8-commas
    # "CPY",      # flake8-copyright
    "C4",      # flake8-comprehensions
    "DTZ",      # flake8-datetimez
    "T10",      # flake8-debugger
    "DJ",      # flake8-django
    "EM",      # flake8-errmsg
    "EXE",      # flake8-executable
    "FA",      # flake8-future-annotations
    "ISC",      # flake8-implicit-str-concat
    "ICN",      # flake8-import-conventions
    "LOG",      # flake8-logging
    # "G",      # flake8-logging-format
    "INP",      # flake8-no-pep420
    "PIE",      # flake8-pie
    # "T20",      # flake8-print
    "PYI",      # flake8-pyi
    "PT",      # flake8-pytest-style
    "Q",      # flake8-quotes
    "RSE",      # flake8-raise
    "RET",      # flake8-return
    # "SLF",      # flake8-self
    "SLOT",      # flake8-slots
    "SIM",      # flake8-simplify
    "TID",      # flake8-tidy-imports
    # "TCH",      # flake8-type-checking
    "INT",      # flake8-gettext
    "ARG",      # flake8-unused-arguments
    "PTH",      # flake8-use-pathlib
    # "TD",      # flake8-todos
    # "FIX",      # flake8-fixme
    "ERA",      # eradicate
    "PD",      # pandas-vet
    "PGH",      # pygrep-hooks
    "PL",      # Pylint
    "C",      # Convention
    "E",      # Error
    "R",      # Refactor
    "W",      # Warning
    "TRY",      # tryceratops
    "FLY",      # flynt
    "NPY",      # NumPy-specific rules
    "AIR",      # Airflow
    "PERF",      # Perflint
    # "FURB",      # refurb
    "RUF",      # Ruff-specific rules
]

ignore = [
    "RET505",  # Unnecessary `else` after `return` statement. This is enabled, even with RET disabled.
    "PGH003",  # Use specific rule codes when ignoring type issues. Too many hits for now.
    "ERA001",  # Found commented-out code. Too many hits for now.
    "EM101",   # Sounds reasonable, but too complex to use.
    "EM102",   # Exception must not use an f-string literal, assign to variable first. Sounds reasonable, but too complex to use.
    "TRY003",  # Avoid specifying long messages outside the exception class. Sounds reasonable, but too complex to use.
    "PLR2004", # magic values like 0x7FFF
]

[lint.mccabe]
# These are the current worst cases in the code. We should try to reduce.
max-complexity = 8
